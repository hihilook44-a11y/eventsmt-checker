name: Encrypted private candidate queue
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      skip_scan:
        description: 'Use the existing queue without scanning the source'
        type: boolean
        default: false
  schedule:
    - cron: '11 */2 * * *'
permissions:
  contents: write
concurrency:
  group: encrypted-private-queue
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==45.0.7'
      - name: Configure checkpoint identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Scan into encrypted queue
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_scan != true }}
        id: source_scan
        continue-on-error: true
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
          AUTOMATIC_AUDIO_RISK_ACCEPTED: 'true'
        run: |
          for attempt in 1 2 3; do
            if python private_queue/secure_scan.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Persist encrypted queue
        if: steps.source_scan.outcome == 'success'
        run: |
          git add private_queue/queue.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Update encrypted candidate queue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Ensure video encoder is available
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq && timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y -qq ffmpeg)
      - name: Verify synthetic pipeline and durable safeguards
        run: |
          python -m unittest discover -s private_queue -p 'test_candidate_recency.py' -v
          python -m unittest discover -s private_queue -p 'test_shorts_render.py' -v
          python -m unittest discover -s private_queue -p 'test_music_triage.py' -v
          python -m unittest discover -s private_queue -p 'test_automatic_audio.py' -v
          python -m unittest discover -s private_queue -p 'test_compilation_assessment.py' -v
          python -m unittest discover -s private_queue -p 'test_workflow_pipeline.py' -v
          python -m unittest discover -s private_queue -p 'test_reviewed_delivery.py' -v
          python -m unittest discover -s private_queue -p 'test_review_intake.py' -v
          python -m unittest discover -s private_queue -p 'test_fallback_dest.py' -v
          python -m unittest discover -s private_queue -p 'test_zernio_*.py' -v
      - name: Process candidate with signed audio review gate
        # Reviewed exact bytes only; unresolved earlier writes block subsequent posts.
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
          WOOPSOCIAL_API_KEY: ${{ secrets.WOOPSOCIAL_API_KEY }}
          AUDIO_REVIEW_PUBLIC_KEY: ${{ secrets.AUDIO_REVIEW_PUBLIC_KEY }}
          WOOPSOCIAL_PROJECT_ID: ${{ secrets.WOOPSOCIAL_PROJECT_ID }}
          WOOPSOCIAL_YOUTUBE_ACCOUNT_ID: ${{ secrets.WOOPSOCIAL_YOUTUBE_ACCOUNT_ID }}
          ZERNIO_SCHEDULED_PUBLISHING_ENABLED: 'true'
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
          ZERNIO_SCHEDULE_DELAY_MINUTES: '15'
          AUTOMATIC_AUDIO_RISK_ACCEPTED: 'true'
        run: python private_queue/workflow_pipeline.py
      - name: Prepare candidate for audio review
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
        run: |
          command -v ffprobe >/dev/null || (timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq && timeout 120 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y -qq ffmpeg)
          for item in $(seq 1 12); do python private_queue/prepare_media.py; done
          git add private_queue/queue.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint encrypted audio-review preparation'
            git push origin HEAD:main
          fi
      - name: Cache pinned audio classifier models (no media)
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/music-models
          key: audio-models-d3835ff-f11d0be
      - name: Assess one prepared audio candidate (not clearance)
        # A low classifier score is never a song-free verdict. Fail closed;
        # never change signed reviews, delivery records or the original audio.
        timeout-minutes: 4
        continue-on-error: true
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
          MUSIC_MODEL_DIR: ${{ runner.temp }}/music-models
        run: |
          set -eu
          mkdir -p "$MUSIC_MODEL_DIR"
          if [ -f "$MUSIC_MODEL_DIR/yamnet.onnx" ] && ! echo 'd3835ffbbd4a1bb3e777f0ca217b5007907f5171dd5d17c4236b95b2af8f908e  '"$MUSIC_MODEL_DIR"'/yamnet.onnx' | sha256sum --check --status; then rm -f "$MUSIC_MODEL_DIR/yamnet.onnx"; fi
          if [ -f "$MUSIC_MODEL_DIR/mn10_as.onnx" ] && ! echo 'f11d0be24823294117798e3c385f53c8193e61e68637fcdd78df32313c4463bd  '"$MUSIC_MODEL_DIR"'/mn10_as.onnx' | sha256sum --check --status; then rm -f "$MUSIC_MODEL_DIR/mn10_as.onnx"; fi
          if [ ! -f "$MUSIC_MODEL_DIR/yamnet.onnx" ]; then
            curl -fsSL --retry 2 --max-time 100 'https://huggingface.co/audiomagic/yamnet-onnx/resolve/f25b741c2f0bdc6d7e6db24b5fddda23347dbafd/yamnet.onnx' -o "$MUSIC_MODEL_DIR/yamnet.onnx"
          fi
          if [ ! -f "$MUSIC_MODEL_DIR/mn10_as.onnx" ]; then
            curl -fsSL --retry 2 --max-time 100 'https://huggingface.co/minhducjp/webdonhac-models/resolve/dd1a7aed13c6aa695266a76844c1333e9089c8a8/mn10_as.onnx' -o "$MUSIC_MODEL_DIR/mn10_as.onnx"
          fi
          echo 'd3835ffbbd4a1bb3e777f0ca217b5007907f5171dd5d17c4236b95b2af8f908e  '"$MUSIC_MODEL_DIR"'/yamnet.onnx' | sha256sum --check --strict
          echo 'f11d0be24823294117798e3c385f53c8193e61e68637fcdd78df32313c4463bd  '"$MUSIC_MODEL_DIR"'/mn10_as.onnx' | sha256sum --check --strict
          python -m pip install 'numpy==1.26.4' 'onnxruntime==1.20.1'
          python private_queue/music_triage.py
          git add private_queue/queue.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint encrypted audio risk assessment'
            git push origin HEAD:main
          fi
      - name: Process conservatively classified audio after assessment
        # Owner accepted detector errors; suspected/failed audio remains blocked.
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
          WOOPSOCIAL_API_KEY: ${{ secrets.WOOPSOCIAL_API_KEY }}
          AUDIO_REVIEW_PUBLIC_KEY: ${{ secrets.AUDIO_REVIEW_PUBLIC_KEY }}
          WOOPSOCIAL_PROJECT_ID: ${{ secrets.WOOPSOCIAL_PROJECT_ID }}
          WOOPSOCIAL_YOUTUBE_ACCOUNT_ID: ${{ secrets.WOOPSOCIAL_YOUTUBE_ACCOUNT_ID }}
          ZERNIO_SCHEDULED_PUBLISHING_ENABLED: 'true'
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
          ZERNIO_SCHEDULE_DELAY_MINUTES: '15'
          AUTOMATIC_AUDIO_RISK_ACCEPTED: 'true'
        run: python private_queue/workflow_pipeline.py
      - name: Assess reviewed compilation readiness (no publication)
        # Read-only: a 10-minute result is readiness, not a rendered video or delivery.
        # Independent from Shorts ledger and stops on unresolved compilation attempts.
        timeout-minutes: 4
        continue-on-error: true
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
          AUDIO_REVIEW_PUBLIC_KEY: ${{ secrets.AUDIO_REVIEW_PUBLIC_KEY }}
          AUTOMATIC_AUDIO_RISK_ACCEPTED: 'true'
        run: python private_queue/compilation_assessment.py
      - name: Report incomplete source scan
        if: steps.source_scan.outcome == 'failure'
        run: |
          echo 'Source scan failed; prior encrypted queue was used and no source absence was inferred.' >&2
          exit 1
