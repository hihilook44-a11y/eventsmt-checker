name: Prepare private media for review
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: encrypted-private-queue
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Acquire encrypted queue lease and refresh checkout
        run: |
          python3 scripts/queue_lease.py acquire --token "$RUNNER_TEMP/queue-lease" --wait 180
          git fetch origin main
          git reset --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==45.0.7'
      - name: Ensure video inspection is available
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Prepare one queued video without publishing
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
        run: python private_queue/prepare_media.py
      - name: Save encrypted review metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add private_queue/queue.enc
          if ! git diff --cached --quiet; then
            git commit -m 'Update encrypted media review metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Release encrypted queue lease
        if: ${{ always() }}
        run: python3 scripts/queue_lease.py release --token "$RUNNER_TEMP/queue-lease"
