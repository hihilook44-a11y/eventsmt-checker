name: Reconcile one verified Zernio post
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: encrypted-private-queue
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Acquire encrypted queue lease and refresh checkout
        run: |
          python3 scripts/queue_lease.py acquire --token "$RUNNER_TEMP/queue-lease" --wait 180
          git fetch origin main
          git reset --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==45.0.7'
      - name: Match the confirmed publication and checkpoint only
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
          AUDIO_REVIEW_PUBLIC_KEY: ${{ secrets.AUDIO_REVIEW_PUBLIC_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python private_queue/reconcile_one_known.py
      - name: Release encrypted queue lease
        if: ${{ always() }}
        run: python3 scripts/queue_lease.py release --token "$RUNNER_TEMP/queue-lease"
