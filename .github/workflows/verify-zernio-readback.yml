name: Verify Zernio post readback (read only)
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Existing Zernio post ID to inspect (no post is created)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm exact YouTube destination by readback
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
          VERIFY_POST_ID: ${{ inputs.post_id }}
        run: |
          python - <<'PY'
          import os
          from zernio_adapter import ZernioProvider
          p = ZernioProvider()
          import urllib.parse
          post_id = os.environ['VERIFY_POST_ID']
          if not p.verify_destination(p.profile, p.account):
              raise SystemExit('Configured YouTube destination did not match')
          post_result = p._api('GET', '/posts/' + urllib.parse.quote(post_id, safe=''))
          post = post_result.get('post') if isinstance(post_result, dict) else None
          if not isinstance(post, dict) or post.get('_id') != post_id:
              raise SystemExit('Post identity unavailable')
          account_query = urllib.parse.urlencode({'profileId': p.profile, 'limit': 100})
          account_result = p._api('GET', '/accounts?' + account_query)
          account_rows = account_result.get('accounts') if isinstance(account_result, dict) else None
          if not isinstance(account_rows, list):
              raise SystemExit('Account list unavailable')
          names = {row.get('_id', row.get('id')): row.get('username')
                   for row in account_rows if isinstance(row, dict)
                   and isinstance(row.get('_id', row.get('id')), str)}
          def inspect_id(label, value, path='accountId', depth=0):
              if isinstance(value, dict):
                  print(label, path, 'object keys:', sorted(value.keys()))
                  if depth < 2:
                      for key, child in value.items():
                          inspect_id(label, child, path + '.' + str(key), depth + 1)
              elif isinstance(value, list):
                  print(label, path, 'array length:', len(value))
                  if depth < 2:
                      for index, child in enumerate(value[:10]):
                          inspect_id(label, child, path + '[' + str(index) + ']', depth + 1)
              elif isinstance(value, str):
                  normalized = value.strip().lower()
                  print(label, path, {
                      'type': 'string', 'length': len(value),
                      'exact_target_match': value == p.account,
                      'normalized_target_match': normalized == p.account.strip().lower(),
                      'mapped_username': names.get(value),
                  })
              else:
                  print(label, path, 'type:', type(value).__name__)
          for row in post.get('platforms', []):
              if isinstance(row, dict):
                  print('POST platform/status:', row.get('platform'), row.get('status'))
                  inspect_id('POST', row.get('accountId'))
          query = urllib.parse.urlencode({'postId': post_id, 'profileId': p.profile,
                                          'platform': 'youtube', 'source': 'late'})
          analytics = p._api('GET', '/analytics?' + query)
          analytics_rows = analytics.get('platformAnalytics') if isinstance(analytics, dict) else None
          if not isinstance(analytics_rows, list):
              raise SystemExit('Analytics rows unavailable')
          for row in analytics_rows:
              if not isinstance(row, dict):
                  continue
              print('ANALYTICS platform/status:', row.get('platform'), row.get('status'))
              inspect_id('ANALYTICS', row.get('accountId'))
              value = row.get('accountId')
              if isinstance(value, str):
                  print('ANALYTICS platform post ID present:', bool(row.get('platformPostId')))
          PY
