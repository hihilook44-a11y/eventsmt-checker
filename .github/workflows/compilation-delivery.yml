name: Conditional reviewed compilation delivery
on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'
permissions:
  contents: write
concurrency:
  group: encrypted-private-queue
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'cryptography==45.0.7' 'Pillow==11.3.0'
      - name: Ensure video encoder is available
        run: bash scripts/ensure-ffmpeg.sh
      - name: Configure checkpoint identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Test compilation and provider safeguards
        run: |
          python -m unittest discover -s private_queue -p 'test_compilation*.py' -v
          python -m unittest discover -s private_queue -p 'test_zernio_*.py' -v
      - name: Compile only when at least ten minutes are audio-cleared
        # This is not classifier-based clearance. No padding, repeated sources,
        # uncertain writes or unsigned audio may enter the compilation.
        env:
          PRIVATE_QUEUE_FERNET_KEY: ${{ secrets.PRIVATE_QUEUE_FERNET_KEY }}
          AUDIO_REVIEW_PUBLIC_KEY: ${{ secrets.AUDIO_REVIEW_PUBLIC_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
          ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
          COMPILATION_ENABLED: 'true'
          AUTOMATIC_AUDIO_RISK_ACCEPTED: 'true'
        run: python private_queue/compilation_delivery.py
