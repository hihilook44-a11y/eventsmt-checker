name: Source availability check
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */2 * * *'
permissions:
  contents: write
concurrency:
  group: source-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check source
        env:
          SOURCE_HANDLE: ${{ secrets.SOURCE_HANDLE }}
        run: python3 check.py
      - name: Save public-ID dedup state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/seen_post_ids.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public source ID dedup state'
            git push origin HEAD:main
          fi

  backup-private-queue:
    needs: check
    if: ${{ always() }}
    uses: ./.github/workflows/private-queue.yml
    secrets: inherit
