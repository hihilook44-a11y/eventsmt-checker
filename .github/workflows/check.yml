name: Source availability check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
concurrency:
  group: source-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check source
        env:
          SOURCE_HANDLE: ${{ secrets.SOURCE_HANDLE }}
        run: python3 check.py
