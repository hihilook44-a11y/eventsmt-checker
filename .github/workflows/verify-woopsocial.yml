name: Verify WoopSocial API secret
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check API key without printing it or account data
        env:
          WOOPSOCIAL_API_KEY: ${{ secrets.WOOPSOCIAL_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get('WOOPSOCIAL_API_KEY', '').strip()
          if not key:
              print('WOOPSOCIAL_API_KEY is missing.')
              sys.exit(1)

          request = urllib.request.Request(
              'https://api.woopsocial.com/v1/projects',
              headers={'Authorization': f'Bearer {key}', 'Accept': 'application/json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
                  if response.status != 200 or not isinstance(data, list):
                      print('WoopSocial returned an unexpected response; details withheld.')
                      sys.exit(1)
          except urllib.error.HTTPError as exc:
              print(f'WoopSocial request rejected (HTTP {exc.code}); response details withheld.')
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
              print(f'WoopSocial check failed ({type(exc).__name__}); details withheld.')
              sys.exit(1)

          print('WoopSocial API key accepted; authenticated read-only check passed.')
          PY
